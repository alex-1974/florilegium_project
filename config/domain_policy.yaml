thresholds:
  gate: 0.30
  review: 0.50
  accept: 0.72
  hard_reject_negative_matches: 3

weights:
  semantic_score: 0.30
  context_score: 0.25
  url_score: 0.15
  scientific_score: 0.10
  domain_score: 0.15
  repository_score: 0.05
  spam_risk: 0.05

# WHY: Domain-level control was too coarse.
# CONSTRAINT: The same university host may contain both excellent research PDFs and useless forms.
# DEFERRED: Host lists should later be learned from audit feedback, not only hand-curated.

